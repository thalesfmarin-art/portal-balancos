name: Atualizar portal

on:
  schedule:
    - cron: "37 0 * * *"   # 21h37 de Brasília (depois dos resultados do dia)
    - cron: "17 11 * * *"  # 08h17 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "site/**", "config.json", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restaurar arquivos já baixados
        uses: actions/cache@v4
        with:
          path: cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - name: Baixar e processar balanços
        run: python scripts/atualizar.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
